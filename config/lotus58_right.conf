# Enable USB connection on halves
CONFIG_ZMK_USB=n

# Increase range
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable EC11 encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Go to sleep after 25 mins (25*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1500000

# CONFIG_ZMK_IDLE_TIMEOUT=10000
# Go to idle state after 2 min (2*60*1000ms)
CONFIG_ZMK_IDLE_TIMEOUT=12000
